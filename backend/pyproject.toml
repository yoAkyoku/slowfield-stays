[project]
name = "slowfield-backend"
version = "0.1.0"
description = "FastAPI backend for Slowfield Stays"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  # Used directly by app/core/crypto.py to encrypt SMTP passwords at rest.
  # It arrived only as a transitive extra of python-jose, so swapping the JWT
  # library would have removed it and turned that encryption into a no-op.
  "cryptography>=42.0.0",
  "asyncpg>=0.29.0",
  "email-validator>=2.2.0",
  "fastapi>=0.111.0",
  "passlib>=1.7.4",
  "pydantic-settings>=2.3.4",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.31",
  "uvicorn[standard]>=0.30.1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.2",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.5.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
